# agent-env 全局配置样例（[[installs]] + [[servers]]）。
#
# 本文件是 agent-env repo 里的样例。真实部署文件由 chezmoi 管理：
#   ~/.config/agent-env/config.toml（源：chezmoi dot_config/agent-env/config.toml）
#
# 顶层表：
#   [[installs]]  skills 安装清单
#   [[servers]]   MCP server 清单
#
# 每个条目的 profiles 必填非空，并决定层级：
#   profiles = ["global"]       全局条目：无条件安装（原 scope = "user"）；
#                               可与其他 tag 混写，如 ["global", "base"]。
#   profiles = ["base", ...]    repo 级条目：受 .agent-env.toml / --profile
#                               的选择门禁（交集非空才安装）。
#   "global" 是保留关键字，不能出现在 .agent-env.toml 或 --profile 中。
#
# secrets 不写在本文件里（放在 ~/.config/agent-env/secrets.toml，chezmoi private）。
# 清单里的 ${VAR} 在解析时展开：先查 secrets.toml，再回退环境变量。
# 样例中的 token 均为 ${VAR} 占位符。
#
# ==================== skills（[[installs]]） ====================
[[installs]]
source = "larksuite/cli"
agents = ["claude-code", "codex", "opencode"]
skills = ["*"]
profiles = ["global"]
mode = "symlink"

[[installs]]
source = "git@code.byted.org:byteapi/bytedcli.git"
agents = ["claude-code", "codex", "opencode"]
skills = ["bytedcli"]
profiles = ["global"]
mode = "symlink"

[[installs]]
source = "git@code.byted.org:machinelearning/super-ops.git"
agents = ["claude-code", "codex", "opencode"]
skills = ["*"]
profiles = ["global"]
mode = "symlink"

# Luma Vision Skill：识图能力的轻量版（相对 agent-mcp 里的 luma MCP）。
# skill 名为 luma-vision（仓库目录叫 vision-skill，但 skills CLI 按 SKILL.md
# 的 frontmatter name 匹配，这里必须写 luma-vision）。
# 依赖 zsh/config.d/common/luma.zsh 导出的 CUSTOM_BASE_URL / CUSTOM_API_KEY /
# CUSTOM_MODEL_NAME——skill 只能从系统环境变量读配置。
# 作为 MCP 之外的按需 skill 备胎；当前只同步到 claude-code / codex / opencode。
[[installs]]
source = "yanickxia/agent-vision"
agents = ["claude-code", "codex", "opencode"]
skills = ["agent-vision"]
profiles = ["global"]
mode = "symlink"

# 搜索三件套（@yanickxia/skills）：brave-search / serpapi-search / youcom-search。
# 替代已移除的 mcphub-search MCP（9 个工具常驻上下文），skill 按需加载。
# 默认直连各家官方 API；BASE_URL 环境变量指向 ai-proxy search 适配器时走统一
# 网关（上游真实 key 由 ai-proxy 注入，客户端只持网关入站 key）。
# env 依赖 zsh/config.d/common/ai-proxy.zsh 导出：
#   BRAVE_SEARCH_BASE_URL / BRAVE_SEARCH_API_KEY（X-Subscription-Token header）
#   SERPAPI_BASE_URL / SERPAPI_API_KEY（api_key query param）
#   YOU_API_BASE_URL / YDC_API_KEY（Authorization: Bearer）
[[installs]]
source = "yanickxia/skills"
agents = ["claude-code", "codex", "opencode"]
skills = ["brave-search", "serpapi-search", "youcom-search"]
profiles = ["global"]
mode = "symlink"

# ClickUp CLI Skill（krodak/clickup-cli）：40+ 命令覆盖任务/sprint/评论/时间跟踪/
# checklist/goals/webhook，skill 名为 clickup。
#
# 仅同步到 claude-code / codex / opencode；opencode 已能承载其它 skill 类型。
# 避免同时给 trae / aiden / kimi-cli 也装一份，减少多路 skill 管理面的漂移。
#
# SKILL.md 约 103 KB，是目前最大的一个；progressive disclosure 只预载
# name+description，闲置开销可忽略，但一旦触发就整块进上下文。
#
# 鉴权：cup 读 CU_API_TOKEN 环境变量，值复用 .chezmoidata/clickup.toml 的
# clickup_token（与 clickup MCP 同一个 token）。需要时再配 zsh 导出。
[[installs]]
source = "krodak/clickup-cli"
agents = ["claude-code", "codex", "opencode"]
skills = ["clickup"]
profiles = ["global"]
mode = "symlink"
post_install = [
  { run = "npm install -g @krodak/clickup-cli", if_missing = "cup" },
]

