# ==================== MCP servers（[[servers]]） ====================

[[servers]]
name = "playwright"
agents = ["claude-code", "codex", "opencode"]
type = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
profiles = ["archived"]
tags = ["browser", "testing"]

# 自托管 Browserless 远程浏览器（办公室/家中两台 NAS 各一套 ghcr.io/browserless/chromium）：
# 经 --cdp-endpoint 复用远端 Chromium，与上面的本地 playwright（本机拉起浏览器）互补。
# 注意：
#   - endpoint 必须是 wss:// 而非 https://：入口前有 nginx basic auth，https 会先做
#     /json/version HTTP 发现、被 401 挡住；wss:// 走 WebSocket 升级跳过 basic auth，
#     由 query 里的 token 鉴权
#   - launch 参数必须预先 URL 编码：{"headless":false} → %7B%22headless%22%3Afalse%7D
#     （远端有头模式，方便观察）
#   - 备用入口（同一 token，默认入口不可达时手工替换）：
#       wss://browserless.inner.yanick.site/  （仅办公内网可达）
#       wss://browserless.vnet.yanick.site/   （家中 NAS 实例，任意 EasyTier/VNet 节点可达）
[[servers]]
name = "browserless"
agents = ["claude-code", "codex", "opencode"]
type = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--cdp-endpoint", "wss://browserless.office.vnet.yanick.site/?token=${BROWSERLESS_TOKEN}&launch=%7B%22headless%22%3Afalse%7D"]
profiles = ["archived"]
tags = ["browser", "playwright", "remote"]
[[servers]]
name = "browseros"
agents = ["claude-code", "codex", "opencode"]
type = "streamable-http"
url = "http://127.0.0.1:9000/mcp"
profiles = ["archived"]
tags = ["browser"]

[[servers]]
name = "super-ops"
agents = ["claude-code", "codex", "opencode"]
type = "streamable-http"
url = "https://superops.byted.org/mcp"
bearer_token_env_var = "OPS_API_TOKEN"
profiles = ["archived"]
tags = ["internal", "ops"]

# opencode 不在此列：oh-my-opencode-slim 插件会自行注册 remote context7
# (https://mcp.context7.com/mcp) 并覆盖本定义，opencode.jsonc 里写这份 stdio
# 定义是死配置（2026-09-17 已移除）。其余 host（codex/claude/trae/aiden/pi）
# 无插件覆盖，仍走本定义。
[[servers]]
name = "bytedcli"
agents = ["claude-code", "codex", "opencode"]
type = "stdio"
command = "bytedcli"
args = ["mcp"]
profiles = ["archived"]
tags = ["internal", "bytedance", "mcp"]
[servers.env]
BYTEDCLI_NO_AUTO_UPGRADE = "1"

