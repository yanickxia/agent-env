# 视觉理解（luma-mcp）：本地 stdio 启动，经 ai-proxy 调用 doubao 视觉模型。
# 单一工具 image_understand，为无原生视觉能力的 agent（codex/opencode/trae 等）提供识图。
# 注意：
#   - CUSTOM_BASE_URL 必须带 /v1，因为 luma 的 CUSTOM_PATH 默认为 /chat/completions
#   - env 的值必须写成字符串，agent-mcp-sync 校验 env 为 string map，裸整数会中断同步
#   - 传图用本地文件路径；luma 对远程 URL 有 SSRF 防护，会拒绝内网地址
#
# 关于 MAX_TOKENS / CUSTOM_TIMEOUT_MS（单张 64x64 测试图实测，非推断）：
# 当前用 doubao-seed-2.0-mini-nothink（nothink 变体，实测极速识图），不走 reasoning，
# max_tokens 实际用不满，32768 只是预留上限、不会变慢；CUSTOM_TIMEOUT_MS=120s 同理留足余量。
#
# 若换回思考模型 doubao-seed-2.1-turbo，luma 内置的长 BASE_VISION_PROMPT 会放大 reasoning，
# max_tokens 给太小会让推理反复churn、反而更慢：
#     4096 -> 180s | 8192(默认) -> 125s | 16384 -> 138s | 32768 -> 73s
# 32768 是思考模型实测最快的取值；但 73s 仍超过 luma 默认的 60s 超时，会触发超时重试
# （总耗时翻到 130s+），所以思考模型必须同时把 CUSTOM_TIMEOUT_MS 提到 120s。
[[servers]]
name = "agent-vision"
agents = ["claude-code", "codex", "opencode"]
type = "stdio"
command = "npx"
args = ["-y", "@yanickxia/agent-vision"]
profiles = ["archived"]
tags = ["vision", "image", "video"]
[servers.env]
AGENT_VISION_BASE_URL = "https://ai-proxy.inner.yanick.site/v1"
AGENT_VISION_API_KEY = "${AGENT_VISION_API_KEY}"
AGENT_VISION_MODEL = "doubao-seed-2.0-mini-nothink"

# ClickUp 官方托管 MCP（public beta），streamable-http，暴露 58 个工具：
# 任务增删改查、Docs、评论、Chat 频道、时间跟踪、提醒、成员解析、跨 workspace 搜索。
# 端点固定为 https://mcp.clickup.com/mcp，无需本地进程。
#
# 鉴权（与官方文档相反，实测结论）：
#   文档 FAQ 写「只支持 OAuth，不能用自己的 API key」——过期了。
#   实测 Authorization: Bearer pk_... 能正常 tools/call 拿到真实数据；
#   换成伪造 token 立刻 401 invalid_token，证明鉴权真实生效。
#   必须带 Bearer 前缀，裸 Authorization: pk_... 是 401。
#   所以这里走 headers 明文注入，不需要走 OAuth 浏览器授权流程。
#
# workspace 必须显式指定：ClickUp MCP 没有「列出 workspace」的工具，
# 不给 workspace 时任何工具都返回 "Please specify which workspace to use"。
# 用 x-workspace-id 头钉死默认值（见 .chezmoidata/clickup.toml），这样 agent
# 不必知道 id 就能直接查询。副作用：连接被锁死在该 workspace，调用时传别的
# workspace_id 会被拒（"not accessible in this session"）。
#
# agents 为何不含 codex / opencode：
#   agent-mcp-sync 对这两个 agent 的 http 渲染只认 bearer_token_env_var，
#   [servers.headers] 里的字面量会被整段丢弃（codex 见 parse_headers_to_bearer_env，
#   opencode 见 render 分支只在 bearer_token_env_var 非空时才写 headers）。
#   结果是 x-workspace-id 传不过去、连 Authorization 都没有，注册了也是 401。
#   claude / trae / aiden 三家都会把 headers 逐条下发，所以只挂这三个。
#   要覆盖 codex/opencode，得先给 agent-mcp-sync 加多 header 支持，而非改这里。
[[servers]]
name = "clickup"
agents = ["claude-code", "codex", "opencode"]
type = "streamable-http"
url = "https://mcp.clickup.com/mcp"
profiles = ["archived"]
tags = ["tasks", "docs", "project-management"]
[servers.headers]
Authorization = "Bearer ${CLICKUP_TOKEN}"
x-workspace-id = "908140"

# Optional fields for codex rendering:
# env_vars = ["GITHUB_TOKEN"]
# startup_timeout_sec = 20

# Optional fields for sync-based agents like Claude and Trae:
# [servers.env]
# DISPLAY = ":0"
#
# [servers.headers]
# Authorization = "Bearer ${TOKEN}"
#
# disabled = false
# disabled_tools = ["*pattern*", "exact_match"]
# timeout = "100s"
# work_dir = "/tmp/my/path"
# scope = "user"  # 可选: user (所有项目) | project (仅当前项目)
# tags = ["tag1", "tag2"]  # 用于 tag-filter 过滤

# sessions（nicknisi/sessions）：本地 stdio MCP，对本机所有 AI coding agent
# （Claude Code / Codex / Pi / OpenCode）的会话历史建一个统一索引，提供
# 搜索历史会话、recall、standup、weekly-summary、memory 等工具。
# 本体是 ~/.local/bin/sessions（v1.27.0），--mcp 切 stdio server 模式。
# scope=user：历史搜索不绑定项目，放全局；和 context7 / bytedcli 一致。
# 注意：本机 Claude Code 可能已通过 sessions 的 plugin marketplace 体系
# （plugin/.mcp.json）注册过同款 server，那里走插件、不经本 manifest；
# 本条目覆盖的是 codex / opencode / trae / aiden 这几家走配置文件的 host。
[[servers]]
name = "sessions"
agents = ["claude-code", "codex", "opencode"]
type = "stdio"
command = "sessions"
args = ["--mcp"]
profiles = ["archived"]
tags = ["sessions", "history", "recall", "memory"]


[[servers]]
name = "ai-proxy"
agents = ["claude-code", "codex", "opencode"]
type = "streamable-http"
url = "https://ai-proxy.inner.yanick.site/mcp"
bearer_token_env_var = "AI_PROXY_API_KEY"   # codex/opencode 只认这个；需在 agent 环境里 export
profiles = ["archived"]
tags = ["vision", "image", "video", "proxy"]
[servers.headers]
Authorization = "Bearer ${AI_PROXY_TOKEN}"

